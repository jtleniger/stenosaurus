{% extends "base.html" %}
{% block title %}{{ display }} · Stenosaurus{% endblock %}
{% block content %}
<p class="back"><a href="/">← All dictations</a></p>
<h1 class="stamp"><time datetime="{{ iso }}" data-local>{{ display }}</time></h1>
<pre class="transcript" id="transcript">{{ text }}</pre>
<button type="button" id="copy" data-copy-target="transcript">Copy text</button>
{% endblock %}
